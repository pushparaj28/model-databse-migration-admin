<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pushpendra Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
}

/* Navbar */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:20px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:700;
}

.admin-btn{
    text-decoration:none;
    color:#fff;
    padding:10px 20px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    transition:.3s;
}

.admin-btn:hover{
    background:rgba(255,255,255,.1);
}

/* Background */

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.05);
}

.c1{
    width:250px;
    height:250px;
    top:-80px;
    left:-80px;
}

.c2{
    width:200px;
    height:200px;
    bottom:-60px;
    right:-60px;
}

/* Card */

.card{
    width:500px;
    text-align:center;
    padding:35px;
    border-radius:20px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 0 25px rgba(56,189,248,.15);
}

.quote{
    font-size:32px;
    font-weight:bold;
    line-height:1.4;
}

.highlight{
    color:yellow;
}

.sub{
    margin:15px 0;
    color:#cbd5e1;
}

.arrow{
    font-size:45px;
    color:#22c55e;
    animation:move 1s infinite;
}

@keyframes move{
    50%{
        transform:translateX(10px);
    }
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 28px;
    border-radius:30px;
    text-decoration:none;
    color:#fff;
    background:#2563eb;
}

.btn:hover{
    opacity:.9;
}

</style>
</head>
<body>

<nav>
    <div class="logo">🚀 Pushpendra Dashboard</div>

    <a href="http://127.0.0.1:8000/admin/" class="admin-btn">
        Admin Dashboard
    </a>
</nav>

<div class="circle c1"></div>
<div class="circle c2"></div>

<div class="card">

    <div class="quote">
        क्या कर रहे हो तुम
        <span class="highlight">पुष्पेन्द्र ?</span>
        <br>
        थोड़ा आगे जाओ...
    </div>

    <p class="sub">
         आज का टास्क था Models Create करना<div class="br"></div>Database Migration करना,<br> Admin Panel Test + Git Commit
         तो आगे जाओ. 
    </p>

    <div class="arrow">➜</div>

    <a href="http://127.0.0.1:8000/admin/" class="btn">
        आगे बढ़ो 🚀
    </a>

</div>

</body>
</html>
